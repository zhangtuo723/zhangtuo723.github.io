<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zhangtuo — Agent 工程师</title>
  <meta name="description" content="zhangtuo · Agent 工程师 · 个人作品集" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'cursive'],
            body: ['VT323', 'monospace'],
          },
          colors: {
            pixel: {
              bg: '#0c0c14',
              fg: '#c8c8c8',
              dim: '#6b6b7b',
              dark: '#1a1a2e',
              border: '#2a2a3a',
              cyan: '#00e5ff',
              magenta: '#ff00a0',
              gold: '#ffd700',
              green: '#00ff88',
            }
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #0c0c14;
      font-family: 'VT323', monospace;
      image-rendering: pixelated;
    }
    html { scroll-behavior: smooth; }

    /* CRT scanline effect */
    .scanlines::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Pixel grid background */
    .pixel-grid {
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Pixel box shadow */
    .pixel-shadow {
      box-shadow:
        4px 4px 0px #2a2a3a,
        4px 4px 0px 1px #2a2a3a;
    }
    .pixel-shadow-cyan {
      box-shadow:
        4px 4px 0px #00e5ff,
        4px 4px 0px 1px #00e5ff;
    }
    .pixel-shadow-magenta {
      box-shadow:
        4px 4px 0px #ff00a0,
        4px 4px 0px 1px #ff00a0;
    }

    /* Pixel border style */
    .pixel-border {
      border: 2px solid #2a2a3a;
    }
    .pixel-border-cyan {
      border: 2px solid #00e5ff;
    }

    /* Text glow */
    .glow-cyan {
      text-shadow:
        0 0 4px #00e5ff,
        0 0 8px #00e5ff;
    }
    .glow-magenta {
      text-shadow:
        0 0 4px #ff00a0,
        0 0 8px #ff00a0;
    }

    /* Blinking cursor */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink::after {
      content: '_';
      animation: blink 1s step-end infinite;
    }

    /* Pixel button hover */
    .pixel-btn {
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pixel-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #00e5ff;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #00e5ff;
    }

    /* Pixel card hover */
    .pixel-card {
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pixel-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #ff00a0;
      border-color: #ff00a0;
    }

    ::selection {
      background: #00e5ff;
      color: #0c0c14;
    }

    /* Scrollbar pixel style */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0c0c14; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border: 1px solid #00e5ff; }
    ::-webkit-scrollbar-thumb:hover { background: #00e5ff; }
  </style>
</head>
<body class="scanlines text-pixel-fg min-h-screen flex flex-col overflow-x-hidden">

  <div class="fixed inset-0 pixel-grid pointer-events-none -z-10"></div>

      <div class="flex items-center gap-4">
        <a href="https://github.com/zhangtuo723" target="_blank" rel="noopener" class="text-pixel-dim hover:text-pixel-cyan transition font-pixel text-[10px]" aria-label="GitHub">
          [GITHUB]
        </a>
        <a href="mailto:1605728334@qq.com" class="text-pixel-dim hover:text-pixel-cyan transition font-pixel text-[10px]" aria-label="Email">

  <script>
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('mobileMenu');
    if (btn && menu) btn.addEventListener('click', () => menu.classList.toggle('hidden'));
  </script>
  <script src="bg.js"></script>
</body>
