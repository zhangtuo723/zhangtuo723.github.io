<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zhangtuo — Agent 工程师</title>
  <meta name="description" content="zhangtuo · Agent 工程师 · 个人作品集" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          animation: {
            'gradient-x': 'gradient-x 8s ease infinite',
            'float': 'float 6s ease-in-out infinite',
            'fade-up': 'fade-up 0.8s ease-out forwards',
            'glow-pulse': 'glow-pulse 4s ease-in-out infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-position': '0% 50%' },
              '50%': { 'background-position': '100% 50%' },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-15px)' },
            },
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'glow-pulse': {
              '0%, 100%': { opacity: '0.25' },
              '50%': { opacity: '0.45' },
            },
          },
        },
      },
    };
  </script>
  <style>
    body { background-color: #020617; }
    html { scroll-behavior: smooth; }
    .text-gradient {
      background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #a855f7 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, #000 40%, transparent 100%);
    }
    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(110px);
      pointer-events: none;
    }
    ::selection { background: rgba(34, 211, 238, 0.3); color: #fff; }
    @keyframes ripple-expand {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(25); opacity: 0; }
    }
  </style>
</head>
